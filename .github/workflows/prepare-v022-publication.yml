name: Prepare v0.2.2 Publication

on:
  repository_dispatch:
    types: [copylasso_prepare_v022_publication]

permissions:
  contents: read

concurrency:
  group: copylasso-v022-publication
  cancel-in-progress: false

jobs:
  quality-gate:
    name: Complete publication quality gate
    if: ${{ github.event_name == 'repository_dispatch' && github.event.action == 'copylasso_prepare_v022_publication' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  prepare-publication:
    name: Prepare private v0.2.2 final release draft
    if: ${{ github.event_name == 'repository_dispatch' && github.event.action == 'copylasso_prepare_v022_publication' && github.ref == 'refs/heads/main' }}
    needs: quality-gate
    runs-on: macos-26
    timeout-minutes: 45
    environment:
      name: release
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      COPYLASSO_V02_PUBLICATION_PROFILE: v0.2.2
    steps:
      - name: Check out exact protected control commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify protected source provenance
        env:
          COPYLASSO_EXPECTED_REF: ${{ github.ref }}
          COPYLASSO_EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          ./scripts/verify-release-workflow-source.sh \
            --expected-ref "$COPYLASSO_EXPECTED_REF" \
            --expected-commit "$COPYLASSO_EXPECTED_COMMIT"

      - name: Initialize private publication paths
        run: |
          source ./scripts/lib/v02-publication-verification.sh
          publication_root="$GITHUB_WORKSPACE/dist/g50-publication/$GITHUB_SHA"
          /bin/mkdir -p "$publication_root"
          printf 'COPYLASSO_G50_PUBLICATION_ROOT=%s\n' \
            "$publication_root" >> "$GITHUB_ENV"
          printf 'COPYLASSO_G50_PUBLICATION_CANDIDATE=%s\n' \
            "$publication_root/candidate" >> "$GITHUB_ENV"
          printf 'COPYLASSO_G50_PUBLICATION_CANDIDATE_READBACK=%s\n' \
            "$publication_root/candidate-release.json" >> "$GITHUB_ENV"
          printf 'COPYLASSO_G50_PUBLICATION_TAG_READBACK=%s\n' \
            "$publication_root/candidate-tag.json" >> "$GITHUB_ENV"
          printf 'COPYLASSO_G50_PUBLICATION_VERIFICATION=%s\n' \
            "$publication_root/verification" >> "$GITHUB_ENV"
          printf 'COPYLASSO_G50_PUBLICATION_APPCAST=%s\n' \
            "$publication_root/appcast.xml" >> "$GITHUB_ENV"
          printf 'COPYLASSO_G50_PUBLICATION_FEED=%s\n' \
            "$publication_root/feed" >> "$GITHUB_ENV"
          printf 'COPYLASSO_G50_PUBLICATION_DRAFT_READBACK=%s\n' \
            "$publication_root/final-draft.json" >> "$GITHUB_ENV"
          printf 'COPYLASSO_G50_PUBLICATION_HANDOFF=%s\n' \
            "$publication_root/publication-handoff" >> "$GITHUB_ENV"
          printf 'COPYLASSO_G50_PUBLICATION_SOURCE_PACKAGES=%s\n' \
            "$RUNNER_TEMP/copylasso-g50-publication-source-packages" >> "$GITHUB_ENV"

      - name: Resolve pinned Sparkle publication tools
        run: |
          xcodebuild -resolvePackageDependencies \
            -project CopyLasso.xcodeproj \
            -scheme CopyLasso \
            -clonedSourcePackagesDirPath "$COPYLASSO_G50_PUBLICATION_SOURCE_PACKAGES"

      - name: Download exact approved private candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/download-v02-candidate.sh \
            --repository "$GITHUB_REPOSITORY" \
            --output-dir "$COPYLASSO_G50_PUBLICATION_CANDIDATE" \
            --readback "$COPYLASSO_G50_PUBLICATION_CANDIDATE_READBACK" \
            --tag-readback "$COPYLASSO_G50_PUBLICATION_TAG_READBACK"

      - name: Reverify approved package without rebuilding
        env:
          COPYLASSO_EXPECTED_TEAM_ID: ${{ secrets.COPYLASSO_EXPECTED_TEAM_ID }}
        run: |
          ./scripts/verify-v02-candidate-package.sh \
            --candidate-dir "$COPYLASSO_G50_PUBLICATION_CANDIDATE" \
            --work-dir "$COPYLASSO_G50_PUBLICATION_VERIFICATION"

      - name: Generate authenticated final update metadata
        env:
          COPYLASSO_SPARKLE_PRIVATE_KEY: ${{ secrets.COPYLASSO_SPARKLE_PRIVATE_KEY }}
        run: |
          source ./scripts/lib/v02-publication-verification.sh
          sparkle_generate_appcast="$(
            /usr/bin/find "$COPYLASSO_G50_PUBLICATION_SOURCE_PACKAGES/artifacts" \
              -type f -path '*/bin/generate_appcast' -print -quit
          )"
          [[ -n "$sparkle_generate_appcast" ]]
          ./scripts/generate-release-appcast.sh \
            --application \
            "$COPYLASSO_G50_PUBLICATION_VERIFICATION/extracted/payload/$COPYLASSO_V02_CANDIDATE_COMMIT/export/CopyLasso.app" \
            --candidate-dir "$COPYLASSO_G50_PUBLICATION_CANDIDATE" \
            --release-notes "$COPYLASSO_V02_RELEASE_NOTES" \
            --output "$COPYLASSO_G50_PUBLICATION_APPCAST" \
            --sparkle-tools-dir "$(/usr/bin/dirname "$sparkle_generate_appcast")"

      - name: Prepare feed-only deployment bundle
        run: |
          source ./scripts/lib/v02-publication-verification.sh
          ./scripts/prepare-update-feed.sh \
            --appcast "$COPYLASSO_G50_PUBLICATION_APPCAST" \
            --release-notes "$COPYLASSO_V02_RELEASE_NOTES" \
            --output-dir "$COPYLASSO_G50_PUBLICATION_FEED"

      - name: Create verified private final draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/create-v02-publication-draft.sh \
            --repository "$GITHUB_REPOSITORY" \
            --candidate-dir "$COPYLASSO_G50_PUBLICATION_CANDIDATE" \
            --readback "$COPYLASSO_G50_PUBLICATION_DRAFT_READBACK"

      - name: Assemble private publication handoff
        run: |
          source ./scripts/lib/v02-publication-verification.sh
          /bin/mkdir -p "$COPYLASSO_G50_PUBLICATION_HANDOFF"
          /usr/bin/ditto "$COPYLASSO_G50_PUBLICATION_FEED" \
            "$COPYLASSO_G50_PUBLICATION_HANDOFF/feed"
          /bin/cp "$COPYLASSO_G50_PUBLICATION_CANDIDATE_READBACK" \
            "$COPYLASSO_G50_PUBLICATION_HANDOFF/candidate-release.json"
          /bin/cp "$COPYLASSO_G50_PUBLICATION_TAG_READBACK" \
            "$COPYLASSO_G50_PUBLICATION_HANDOFF/candidate-tag.json"
          /bin/cp "$COPYLASSO_G50_PUBLICATION_DRAFT_READBACK" \
            "$COPYLASSO_G50_PUBLICATION_HANDOFF/final-draft.json"
          /usr/bin/jq -n \
            --arg control_commit "$GITHUB_SHA" \
            --arg candidate_commit "$COPYLASSO_V02_CANDIDATE_COMMIT" \
            --arg candidate_tag "$COPYLASSO_V02_CANDIDATE_TAG" \
            --arg final_tag "$COPYLASSO_V02_FINAL_TAG" \
            --arg dmg_sha256 "$COPYLASSO_V02_DMG_SHA256" \
            --arg appcast_sha256 "$(
              /usr/bin/shasum -a 256 "$COPYLASSO_G50_PUBLICATION_APPCAST" |
                /usr/bin/awk '{print $1}'
            )" \
            --argjson draft_id "$(
              /usr/bin/jq -er '.id' "$COPYLASSO_G50_PUBLICATION_DRAFT_READBACK"
            )" \
            '{
              control_commit: $control_commit,
              candidate_commit: $candidate_commit,
              candidate_tag: $candidate_tag,
              final_tag: $final_tag,
              final_draft_id: $draft_id,
              dmg_sha256: $dmg_sha256,
              appcast_sha256: $appcast_sha256
            }' > "$COPYLASSO_G50_PUBLICATION_HANDOFF/publication-manifest.json"
          ./scripts/audit-g50-publication.sh \
            --handoff "$COPYLASSO_G50_PUBLICATION_HANDOFF" \
            --candidate-dir "$COPYLASSO_G50_PUBLICATION_CANDIDATE" \
            --application \
            "$COPYLASSO_G50_PUBLICATION_VERIFICATION/extracted/payload/$COPYLASSO_V02_CANDIDATE_COMMIT/export/CopyLasso.app"

      - name: Upload private publication handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: copylasso-v0.2.2-publication
          path: ${{ env.COPYLASSO_G50_PUBLICATION_HANDOFF }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
